<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Customers — Santi Blinds Admin</title>
  <link rel="icon" type="image/png" href="../images/Icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Quicksand:wght@300;400;500;600&family=Open+Sans:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body class="admin-body">

  <div class="admin-shell">
    <aside class="admin-sidebar">
      <div class="admin-sidebar__brand">
        <img src="../images/SantiLogoNoBg.png" alt="Santi Blinds logo" />
        <span>SANTI <em>BLINDS</em></span>
      </div>
      <span class="section-label" style="padding-left:1.75rem;">Admin Panel</span>

      <nav class="admin-nav">
        <a href="admin-dashboard.html" class="admin-nav__link">Dashboard</a>
        <a href="admin-orders.html" class="admin-nav__link">Orders</a>
        <a href="admin-inventory.html" class="admin-nav__link">Inventory</a>
        <a href="admin-sales.html" class="admin-nav__link">Sales & Revenue</a>
        <a href="admin-customers.html" class="admin-nav__link active">Customers</a>
        <a href="admin-reports.html" class="admin-nav__link">Reports</a>
        <a href="admin-audit.html" class="admin-nav__link">Audit Log</a>
      </nav>

      <div class="admin-sidebar__footer">
        <span id="adminName">—</span>
        <button id="logoutBtn" class="link-arrow">Log Out <span>→</span></button>
      </div>
    </aside>

    <main class="admin-main">
      <div class="admin-view__header">
        <h1 class="section-title">Customers</h1>
        <p class="section-desc">Customer profiles, with location and contact number.</p>
      </div>
      <div class="admin-toolbar">
        <input type="text" id="customerSearch" placeholder="Search name, phone, or location…" />
      </div>
      <div class="admin-table-wrap">
        <table class="admin-table" id="customersTable">
          <thead><tr><th>Name</th><th>Location</th><th>Contact No.</th><th>Email</th><th></th></tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </main>
  </div>

  <!-- CUSTOMER DETAIL MODAL -->
  <div class="admin-modal" id="customerModal" hidden>
    <div class="admin-modal__panel">
      <button class="admin-modal__close" data-close>&times;</button>
      <h3 id="cmName"></h3>
      <div class="admin-modal__grid">
        <div><span class="admin-modal__label">Location</span><p id="cmLocation"></p></div>
        <div><span class="admin-modal__label">Contact No.</span><p id="cmPhone"></p></div>
        <div><span class="admin-modal__label">Email</span><p id="cmEmail"></p></div>
        <div><span class="admin-modal__label">Customer Since</span><p id="cmSince"></p></div>
      </div>
      <div>
        <span class="admin-modal__label">Order History</span>
        <div class="admin-table-wrap">
          <table class="admin-table" id="cmOrdersTable">
            <thead><tr><th>ID</th><th>Product</th><th>Status</th><th>Amount</th><th>Date</th></tr></thead>
            <tbody></tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <script src="../javascript/script.js"></script>
</body>
</html>
